<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Countdown — EC Paris</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link href="https://fonts.googleapis.com/css2?family=DM+Serif+Display&family=Inter:wght@400;500;600&display=swap" rel="stylesheet" />
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      background: transparent;
      display: flex;
      justify-content: center;
      align-items: center;
      min-height: 100vh;
      padding: 0.5rem;
    }
    #fiche {
      background: #1B2A4A;
      border-radius: 10px;
      padding: 1.25rem 1.25rem 1rem;
      width: 100%;
      max-width: 240px;
      font-family: 'Inter', sans-serif;
      position: relative;
      overflow: hidden;
    }
    #fiche-accent {
      position: absolute;
      top: 0; left: 0; right: 0;
      height: 3px;
      background: #E8A921;
      border-radius: 10px 10px 0 0;
    }
    #fiche-badge {
      display: inline-flex;
      align-items: center;
      gap: 4px;
      background: #E8A921;
      color: #1B2A4A;
      font-size: 9px;
      font-weight: 600;
      letter-spacing: 0.08em;
      text-transform: uppercase;
      padding: 3px 8px;
      border-radius: 99px;
      margin-bottom: 0.75rem;
    }
    #fiche-titre {
      font-family: 'DM Serif Display', serif;
      font-size: 12px;
      color: #ffffff;
      margin-bottom: 0.15rem;
      line-height: 1.2;
    }
    #fiche-sous {
      font-size: 10px;
      color: rgba(255,255,255,0.5);
      margin-bottom: 1rem;
    }
    #fiche-sep {
      height: 1px;
      background: rgba(255,255,255,0.1);
      margin-bottom: 1rem;
    }
    #fiche-center {
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 0.15rem;
      margin-bottom: 0.9rem;
    }
    #cd-big {
      font-family: 'DM Serif Display', serif;
      font-size: 52px;
      line-height: 1;
      color: #E8A921;
      letter-spacing: -1px;
    }
    #cd-unit {
      font-size: 9px;
      font-weight: 500;
      letter-spacing: 0.14em;
      text-transform: uppercase;
      color: rgba(255,255,255,0.5);
    }
    #fiche-date {
      text-align: center;
      font-size: 10px;
      color: rgba(255,255,255,0.35);
    }
  </style>
</head>
<body>
  <div id="fiche">
    <div id="fiche-accent"></div>
    <div id="fiche-badge">
      <svg xmlns="http://www.w3.org/2000/svg" width="9" height="9" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><rect x="3" y="4" width="18" height="18" rx="2"/><line x1="16" y1="2" x2="16" y2="6"/><line x1="8" y1="2" x2="8" y2="6"/><line x1="3" y1="10" x2="21" y2="10"/></svg>
      Journée créativité
    </div>
    <div id="fiche-titre">Enseignement Catholique de Paris</div>
    <div id="fiche-sous">Compte à rebours — Jour J</div>
    <div id="fiche-sep"></div>
    <div id="fiche-center">
      <div id="cd-big">—</div>
      <div id="cd-unit">jours restants</div>
    </div>
    <div id="fiche-date">
      <svg xmlns="http://www.w3.org/2000/svg" width="10" height="10" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" style="vertical-align:-1px; margin-right:4px; opacity:.5;" aria-hidden="true"><rect x="3" y="4" width="18" height="18" rx="2"/><line x1="16" y1="2" x2="16" y2="6"/><line x1="8" y1="2" x2="8" y2="6"/><line x1="3" y1="10" x2="21" y2="10"/></svg>
      7 octobre 2026
    </div>
  </div>

  <script>
    (function() {
      const target = new Date('2026-10-07T00:00:00');
      const now = new Date();
      const daysLeft = Math.max(0, Math.ceil((target - now) / 86400000));
      document.getElementById('cd-big').textContent = daysLeft;
    })();
  </script>
</body>
</html>
