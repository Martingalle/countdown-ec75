      position: absolute;

      align-items: center;
      gap: 3%;

      color: #1B2A4A;

      text-transform: uppercase;

      border-radius: 99px;
      margin-bottom: 5%;

      height: 1px;
      background: rgba(232,169,33,0.4);
      margin-bottom: 5%;

      font-size: 23vw;
      line-height: 0.9;
      color: #E8A921;
      letter-spacing: -0.03em;
    }

      font-size: 2vw;
      font-weight: 600;
      letter-spacing: 0.18em;
      text-transform: uppercase;
      color: rgba(255,255,255,0.6);
      margin-top: 2%;
      margin-bottom: 5%;
    }

    #fiche-date {
      font-size: 1.9vw;
      color: rgba(255,255,255,0.35);
      letter-spacing: 0.05em;
    }

  <div id="ratio-box">
    <div id="fiche">

      <div id="bg-photo"></div>
      <div id="fiche-accent"></div>
      <div id="fiche-accent-bottom"></div>
      <div class="content">
        <div id="fiche-badge">Journée créativité</div>
        <div id="fiche-sep"></div>
        <div id="cd-big">—</div>
        <div id="cd-unit">jours restants</div>
        <div id="fiche-date">7 octobre 2026</div>
      </div>
    </div>
  </div>
  <script>
    const target = new Date('2026-10-07T00:00:00');
    const now = new Date();
    const days = Math.max(0, Math.ceil((target - now) / 86400000));
    document.getElementById('cd-big').textContent = days;
  </script>
