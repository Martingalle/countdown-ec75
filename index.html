<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Countdown — EC Paris</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link href="https://fonts.googleapis.com/css2?family=DM+Serif+Display&family=Inter:wght@400;500;600&display=swap" rel="stylesheet" />
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }

    html, body {
      width: 100%;
      height: 100%;
      background: transparent;
    }

    /* Carré responsive : padding-bottom 100% = hauteur égale à la largeur */
    #ratio-box {
      position: relative;
      width: 100%;
      padding-bottom: 100%;
    }

    #fiche {
      position: absolute;
      inset: 0;
      background: #1B2A4A;
      border-radius: 10%;
      font-family: 'Inter', sans-serif;
      overflow: hidden;

      /* Tout le contenu est centré via flexbox */
      display: flex;
      flex-direction: column;
      justify-content: center;
      align-items: center;
      gap: 0;
    }

    /* Barre dorée en haut */
    #fiche-accent {
      position: absolute;
      top: 0; left: 0; right: 0;
      height: 2%;
      background: #E8A921;
    }

    #fiche-badge {
      display: inline-flex;
      align-items: center;
      gap: 3%;
      background: #E8A921;
      color: #1B2A4A;
      font-size: 2.2vw;
      font-weight: 600;
      letter-spacing: 0.08em;
      text-transform: uppercase;
      padding: 1.5% 5%;
      border-radius: 99px;
      margin-bottom: 5%;
    }

    #fiche-titre {
      font-family: 'DM Serif Display', serif;
      font-size: 4vw;
      color: #ffffff;
      margin-bottom: 1%;
      line-height: 1.2;
      text-align: center;
      padding: 0 5%;
    }

    #fiche-sous {
      font-size: 2vw;
      color: rgba(255,255,255,0.5);
      margin-bottom: 6%;
      text-align: center;
    }

    #fiche-sep {
      width: 80%;
      height: 1px;
      background: rgba(255,255,255,0.15);
      margin-bottom: 6%;
    }

    #cd-big {
      font-family: 'DM Serif Display', serif;
      font-size: 22vw;
      line-height: 1;
      color: #E8A921;
      letter-spacing: -0.03em;
    }

    #cd-unit {
      font-size: 2vw;
      font-weight: 500;
      letter-spacing: 0.14em;
      text-transform: uppercase;
      color: rgba(255,255,255,0.5);
      margin-top: 1%;
      margin-bottom: 6%;
    }

    #fiche-date {
      font-size: 1.8vw;
      color: rgba(255,255,255,0.3);
      display: flex;
      align-items: center;
      gap: 4px;
    }
  </style>
</head>
<body>
  <div id="ratio-box">
    <div id="fiche">
      <div id="fiche-accent"></div>

      <div id="fiche-badge">Journée créativité</div>

      <div id="fiche-titre">Enseignement Catholique de Paris</div>
      <div id="fiche-sous">Compte à rebours — Jour J</div>

      <div id="fiche-sep"></div>

      <div id="cd-big">—</div>
      <div id="cd-unit">jours restants</div>

      <div id="fiche-date">
        <svg xmlns="http://www.w3.org/2000/svg" width="1.8vw" height="1.8vw" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><rect x="3" y="4" width="18" height="18" rx="2"/><line x1="16" y1="2" x2="16" y2="6"/><line x1="8" y1="2" x2="8" y2="6"/><line x1="3" y1="10" x2="21" y2="10"/></svg>
        7 octobre 2026
      </div>
    </div>
  </div>

  <script>
    (function() {
      const target = new Date('2026-10-07T00:00:00');
      const now = new Date();
      const daysLeft = Math.max(0, Math.ceil((target - now) / 86400000));
      document.getElementById('cd-big').textContent = daysLeft;
    })();
  </script>
</body>
</html>
